[package]
name = "pm"
version = "0.1.0"
edition = "2021"
description = "Touch ID–gated path-keyed password manager"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
fs4 = "0.13"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSRunLoop", "NSDate"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext"] }
security-framework = "3"
